<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAJA Roadside Assistance JA</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; }
body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; }
.card, .button-box { background-color: #1e1e1e; color: #ffffff; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; }
.container { width: 100%; background: #121212; padding: 15px 0 40px 0; text-align: center; min-height: 100vh; }
.logo { height: 70px; width: auto; }
  <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#000; border-bottom:3px solid #ff0000;">
  
  <img src="logo.png" alt="RAJA Logo" class="logo">
  <img src="raja-truck.png" alt="RAJA Truck" class="logo">

</div>
h1 { color: #ff4d4d; font-size: 22px; margin: 10px 15px 20px 15px; }
.btn { display: block; width: 90%; margin: 12px auto; padding: 18px; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 16px; }
.whatsapp { background: #25D366; }
.call { background: #007BFF; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 90%; margin: 20px auto; }
.box { padding: 22px 10px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border: 2px solid; background: #1e1e1e; color: #fff; }
.towing { border-color: #ff6b6b; color: #ff8a65; }
.fuel { border-color: #ffcc66; color: #ffd699; }
.battery { border-color: #66cc66; color: #81c784; }
.tire { border-color: #6699ff; color: #90caf9; }
.mechanic { border-color: #888; color: #ccc; grid-column: span 2; }
#modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
.modal-content { background: #1e1e1e; color: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
.close { float: right; font-size: 32px; font-weight: bold; cursor: pointer; color: #999; line-height: 24px; }
.modalTitle { text-align: center; color: #25D366; margin-bottom: 15px; font-size: 20px; }
.provider { padding: 15px; margin: 10px 0 12px 0; background: #2a2a2a; border-radius: 8px; border-left: 4px solid #25D366; text-align: left; }
.provider b { font-size: 16px; color: #fff; }
.provider .info { margin: 8px 0 12px 0; color: #bbb; font-size: 14px; }
.contact-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.contact-btns a { flex: 1; min-width: 90px; text-align: center; padding: 10px 12px; border-radius: 6px; text-decoration: none; color: white; font-size: 13px; font-weight: bold; }
.phone-call { background: #007BFF; }
.wa-chat { background: #25D366; }
.wa-call { background: #128C7E; }
</style>
</head>
<body>

<div class="container">
  <img src="logo.png" alt="RAJA Logo" class="logo">
  <h1>RAJA Roadside Assistance JA 🇯🇲</h1>

  <a href="https://wa.me/18769605738" class="btn whatsapp">Get Help Now on WhatsApp</a>
  <a href="tel:+18769605738" class="btn call">Call Dispatch: 876-960-5738</a>

  <div class="grid">
    <button class="box towing" onclick="openList('tow')">🚛<br>Towing</button>
    <button class="box fuel" onclick="openList('fuel')">⛽<br>Fuel</button>
    <button class="box battery" onclick="openList('battery')">🔋<br>Battery</button>
    <button class="box tire" onclick="openList('tyre')">🛞<br>Flat Tire</button>
    <button class="box mechanic" onclick="openList('mechanic')">🔧<br>Mechanic</button>
  </div>
</div>

<div id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle" class="modalTitle"></h2>
    <div id="providerList"></div>
  </div>
</div>

<script>
const providers = {
  tow: [
    { name: "Joe", phone: "18768945740", parish: "May Pen" },
    { name: "Blacks", phone: "18768062453", parish: "Old Harbour" },
    { name: "Add Tow 3", phone: "8760000", parish: "Parish" },
    { name: "Add Tow 4", phone: "8760000", parish: "Parish" },
    { name: "Add Tow 5", phone: "8760000", parish: "Parish" }
  ],
  fuel: [
    { name: "Add Fuel 1", phone: "8760000", parish: "Parish" },
    { name: "Add Fuel 2", phone: "8760000", parish: "Parish" },
    { name: "Add Fuel 3", phone: "8760000", parish: "Parish" },
    { name: "Add Fuel 4", phone: "8760000", parish: "Parish" },
    { name: "Add Fuel 5", phone: "8760000", parish: "Parish" }
  ],
  battery: [
    { name: "Joe", phone: "18768945740", parish: "May Pen" },
    { name: "Blacks", phone: "18768062453", parish: "Old Harbour" },
    { name: "Add Battery 3", phone: "8760000", parish: "Parish" },
    { name: "Add Battery 4", phone: "8760000", parish: "Parish" },
    { name: "Add Battery 5", phone: "8760000", parish: "Parish" }
  ],
  tyre: [
    { name: "Add Tyre 1", phone: "8760000", parish: "Parish" },
    { name: "Add Tyre 2", phone: "8760000", parish: "Parish" },
    { name: "Add Tyre 3", phone: "8760000", parish: "Parish" },
    { name: "Add Tyre 4", phone: "8760000", parish: "Parish" },
    { name: "Add Tyre 5", phone: "8760000", parish: "Parish" }
  ],
  mechanic: [
    { name: "Joe", phone: "18768945740", parish: "May Pen" },
    { name: "Blacks", phone: "18768062453", parish: "Old Harbour" },
    { name: "Add Mechanic 3", phone: "8760000", parish: "Parish" },
    { name: "Add Mechanic 4", phone: "8760000", parish: "Parish" },
    { name: "Add Mechanic 5", phone: "8760000", parish: "Parish" }
  ]
};

function openList(category) {
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const list = document.getElementById('providerList');
  const names = {tow: 'TOWING', fuel: 'FUEL', battery: 'BATTERY', tyre: 'FLAT TIRE', mechanic: 'MECHANIC'};

  title.innerText = names[category] + " PROVIDERS";
  list.innerHTML = '';

  providers[category].forEach(p => {
    list.innerHTML += `
      <div class="provider">
        <b>${p.name}</b>
        <div class="info">📍 ${p.parish} | ${p.phone}</div>
        <div class="contact-btns">
          <a href="tel:${p.phone}" class="phone-call">📞 Call</a>
          <a href="https://wa.me/${p.phone}" class="wa-chat">💬 Chat</a>
          <a href="https://wa.me/${p.phone}" class="wa-call">📹 WA Call</a>
        </div>
      </div>`;
  });
  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

document.getElementById('modal').onclick = function(e) {
  if(e.target.id === 'modal') closeModal();
}
</script>

</body>
</html>
