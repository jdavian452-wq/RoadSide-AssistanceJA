  <!DOCTYPE html>

<head>

<title>RAJA Roadside Assistance JA</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 15px; }
  
  img.logo { width: 100%; max-width: 400px; margin: 10px auto 20px; }
  
  h1 { color: #d32f2f; font-size: 20px; margin-bottom: 15px; }
  
 .btn-reset { border: none; cursor: pointer; }
  
 .main-btn { display: block; width: 95%; margin: 8px auto; padding: 15px; border-radius: 8px;
    color: white; font-weight: bold; font-size: 16px; text-decoration: none; }
 .whatsapp { background: #25D366; }
 .call { background: #007BFF; }
  
 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 400px; margin: 20px auto; }
 .service-btn { padding: 25px 10px; border-radius: 10px; font-size: 16px; font-weight: bold; color: white; }
 .tow { background: #00a651; }
 .fuel { background: #ffc107; color: #000; }
 .battery { background: #2196F3; }
 .tyre { background: #000; }
 .mechanic { background: #9C27B0; grid-column: span 2; }
  
  /* MODAL STYLING */
 .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
 .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; 
    max-height: 80vh; overflow-y: auto; text-align: left; }
 .modal-content h2 { margin-bottom: 15px; color: #00a651; }
 .close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
 .provider { padding: 12px; margin: 8px 0; background: #f1f1f1; border-radius: 8px; }
 .provider a { text-decoration: none; color: #007BFF; font-weight: bold; display: block; }
 .provider span { font-size: 13px; color: #555; }
</style>
</head>
<body>

<img src="raja-logo.jpg" class="logo" alt="Roadside Assistance JA">

<h1>RAJA Roadside Assistance JA 🇯🇲</h1>

<a href="https://wa.me/18769605738" class="main-btn whatsapp btn-reset">Get Help Now on WhatsApp</a>
<a href="tel:8769605738" class="main-btn call btn-reset">Call Dispatch: 876-960-5738</a>

<div class="grid">
  <button class="service-btn tow btn-reset" onclick="showModal('tow')">🚛 TOW</button>
  <button class="service-btn fuel btn-reset" onclick="showModal('fuel')">⛽ FUEL</button>
  <button class="service-btn battery btn-reset" onclick="showModal('battery')">🔋 BATTERY</button>
  <button class="service-btn tyre btn-reset" onclick="showModal('tyre')">🛞 TYRE</button>
  <button class="service-btn mechanic btn-reset" onclick="showModal('mechanic')">🔧 MECHANICS</button>
</div>

<!-- MODAL POPUP -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle"></h2>
    <div id="providerList"></div>
  </div>
</div>

<script>
// PLACEHOLDER DATA - SWAP THIS WITH REAL CONTACTS LATER
const providers = {
  tow: [
    { name: "Add Tow Provider Name", phone: "8760000000", parish: "Kingston" },
    { name: "Add Tow Provider Name", phone: "8760000", parish: "St. Andrew" }
  ],
  fuel: [
    { name: "Add Fuel Provider Name", phone: "8760000000", parish: "Kingston" },
    { name: "Add Fuel Provider Name", phone: "8760000000", parish: "St. Catherine" }
  ],
  battery: [
    { name: "Add Battery Provider Name", phone: "8760000000", parish: "Kingston" },
    { name: "Add Battery Provider Name", phone: "8760000000", parish: "St. Andrew" }
  ],
  tyre: [
    { name: "Add Tyre Provider Name", phone: "8760000000", parish: "Kingston" },
    { name: "Add Tyre Provider Name", phone: "8760000000", parish: "St. James" }
  ],
  mechanic: [
    { name: "Add Mechanic Name", phone: "8760000", parish: "Kingston" },
    { name: "Add Mechanic Name", phone: "8760000", parish: "St. Andrew" }
  ]
};

function showModal(category) {
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const list = document.getElementById('providerList');
  
  title.innerText = category.toUpperCase() + " PROVIDERS";
  list.innerHTML = '';
  
  providers[category].forEach(p => {
    list.innerHTML += `
      <div class="provider">
        <a href="tel:${p.phone}">${p.name}</a>
        <span>${p.parish} | ${p.phone}</span>
      </div>
    `;
  });
  
  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

// close modal if user clicks outside
window.onclick = function(event) {
  if (event.target == document.getElementById('modal')) {
    closeModal();
  }
}
</script>

</body>
